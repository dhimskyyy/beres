name: beres_shared
description: Shared package for Beres User and Tukang apps (models, theme, constants, map adapter, supabase client)
version: 1.4.0
publish_to: 'none'

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.10.0'

dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: ^2.8.0
  google_fonts: ^6.2.1
  intl: ^0.19.0
  geolocator: ^14.1.2
  image_picker: ^1.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  assets:
    - assets/beres_long.png
    - assets/images/auth_bg.jpg
    - assets/splash/
